<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>PRO3S WQIS — เข้าสู่ระบบ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <script>
    (function(){
      var host = window.location.hostname;
      var isLocal = window.location.protocol==='file:'||host==='localhost'||host==='127.0.0.1'||host==='';
      if(isLocal) document.write('<scr'+'ipt src="generated-users.js"><\/scr'+'ipt>');
    })();
  </script>
  <script src="auth.js"></script>
</head>
<body>

<div class="login-page">
  <div class="login-bg-pattern"></div>

  <div class="login-card">

    <div class="login-logo-wrap">
      <img class="login-logo" src="PRO3S_Logo_001.png" alt="PRO3S"
           onerror="this.style.display='none';document.getElementById('logoPh').style.display='flex'"/>
      <div class="login-logo-ph" id="logoPh" style="display:none">P3</div>
      <div class="login-title">PRO3S WQIS</div>
      <div class="login-subtitle">ระบบตรวจสอบคุณภาพงานเชื่อม</div>
    </div>

    <div id="errorBanner" class="alert alert-error mb-16" style="display:none">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0">
        <circle cx="10" cy="10" r="8"/><path d="M10 7v4M10 14h.01"/>
      </svg>
      <span id="errorText">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</span>
    </div>

    <form id="loginForm" autocomplete="on">
      <div style="display:flex;flex-direction:column;gap:14px">

        <div class="form-group" style="margin-bottom:0">
          <label class="form-label" for="username">ชื่อผู้ใช้ (Username)</label>
          <div style="position:relative">
            <div style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-4);pointer-events:none;display:flex">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/>
              </svg>
            </div>
            <input class="form-control" style="padding-left:34px" type="text" id="username" name="username"
                   placeholder="กรอกชื่อผู้ใช้" autocomplete="username" required/>
          </div>
        </div>

        <div class="form-group" style="margin-bottom:0">
          <label class="form-label" for="password">รหัสผ่าน (Password)</label>
          <div class="pw-wrap" style="position:relative">
            <div style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-4);pointer-events:none;display:flex">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="10" width="18" height="12" rx="2"/><path d="M7 10V7a5 5 0 0110 0v3"/>
              </svg>
            </div>
            <input class="form-control" style="padding-left:34px;padding-right:40px" type="password" id="password"
                   name="password" placeholder="กรอกรหัสผ่าน" autocomplete="current-password" required/>
            <button type="button" class="pw-eye" id="pwToggle" title="แสดง/ซ่อนรหัสผ่าน">
              <svg id="pwIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="login-forgot">
          <span class="login-forgot-link" onclick="alert('กรุณาติดต่อผู้ดูแลระบบ')">ลืมรหัสผ่าน?</span>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <div class="login-spinner" id="loginSpinner"></div>
          <span id="loginBtnText">เข้าสู่ระบบ</span>
        </button>

      </div>
    </form>

    <!-- Demo credentials -->
    <div style="margin-top:20px;border-top:1px solid var(--border-lt);padding-top:16px">
      <button type="button" id="demoToggle" style="background:none;border:none;cursor:pointer;font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:4px;margin:0 auto;font-family:inherit">
        <svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="demoChevron">
          <path d="M5 8l5 5 5-5"/>
        </svg>
        บัญชีทดสอบ (Demo Accounts)
      </button>
      <div id="demoList" style="display:none;flex-direction:column;gap:4px;margin-top:10px"></div>
    </div>

  </div><!-- /login-card -->

  <div class="login-footer">
    PRO3S WQIS v1.0.0 &nbsp;·&nbsp; Industrial QA/QC Platform &nbsp;·&nbsp; © 2026 PRO3S
  </div>
</div>

<script>
'use strict';

// Redirect if already authenticated
if (window.Auth && Auth.isAuthenticated()) {
  window.location.replace('WQIS-PRO3S.html');
}

// Theme: login page is always light
document.documentElement.setAttribute('data-theme','light');

// Password toggle
const pwInput  = document.getElementById('password');
const pwIcon   = document.getElementById('pwIcon');
const pwToggle = document.getElementById('pwToggle');
pwToggle.addEventListener('click', () => {
  const show = pwInput.type === 'password';
  pwInput.type = show ? 'text' : 'password';
  pwIcon.innerHTML = show
    ? '<path d="M3 3l18 18M10.6 10.6A3 3 0 0113.4 13.4M1 12s4-7 11-7c1.9 0 3.6.5 5.1 1.4M20.9 12.8C19.7 15.2 17 18 12 18c-1.5 0-2.9-.3-4.1-.8"/>'
    : '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>';
});

// Demo accounts
const DEMO_FALLBACK = [
  { username:'admin',     password:'pro3s@admin', role:'admin',     label:'ผู้ดูแลระบบ' },
  { username:'inspector', password:'weld@2024',   role:'inspector', label:'ผู้ตรวจสอบ' },
  { username:'viewer',    password:'view@2024',   role:'viewer',    label:'ผู้ชม' },
];
const DEMOS = (Array.isArray(window.WQIS_USERS) && window.WQIS_USERS.length)
  ? window.WQIS_USERS.filter(u => u.status !== 'disabled').map(u => ({
      username: u.username, password: u.password, role: u.role,
      label: u.role === 'admin' ? 'ผู้ดูแลระบบ' : u.role === 'inspector' ? 'ผู้ตรวจสอบ' : 'ผู้ชม',
    }))
  : DEMO_FALLBACK;

const ROLE_COLORS = {
  admin:     { bg:'rgba(27,58,107,0.10)', color:'#1B3A6B' },
  inspector: { bg:'rgba(13,115,119,0.12)',color:'#0D7377' },
  viewer:    { bg:'rgba(108,117,125,0.12)',color:'#495057' },
};

const demoList = document.getElementById('demoList');
DEMOS.forEach(d => {
  const c = ROLE_COLORS[d.role] || ROLE_COLORS.viewer;
  const el = document.createElement('div');
  el.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;border:1px solid #E9ECEF;cursor:pointer;background:#fff;gap:10px;transition:background 0.15s';
  el.onmouseenter = () => el.style.background = '#F8F9FA';
  el.onmouseleave = () => el.style.background = '#fff';
  el.innerHTML = `
    <div>
      <div style="font-size:13px;font-weight:600;color:#212529">${d.username}</div>
      <div style="font-size:11px;color:#6C757D">${d.password}</div>
    </div>
    <span style="padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;background:${c.bg};color:${c.color}">${d.label}</span>`;
  el.addEventListener('click', () => {
    document.getElementById('username').value = d.username;
    document.getElementById('password').value = d.password;
    document.getElementById('loginForm').dispatchEvent(new Event('submit',{cancelable:true}));
  });
  demoList.appendChild(el);
});

let demoOpen = false;
document.getElementById('demoToggle').addEventListener('click', () => {
  demoOpen = !demoOpen;
  demoList.style.display = demoOpen ? 'flex' : 'none';
  document.getElementById('demoChevron').style.transform = demoOpen ? 'rotate(180deg)' : '';
});

// Login form
const loginForm = document.getElementById('loginForm');
const loginBtn  = document.getElementById('loginBtn');
const loginSpinner = document.getElementById('loginSpinner');
const loginBtnText = document.getElementById('loginBtnText');
const errorBanner  = document.getElementById('errorBanner');
const errorText    = document.getElementById('errorText');

function showError(msg) {
  errorBanner.style.display = 'flex';
  errorText.textContent = msg;
}
function hideError() { errorBanner.style.display = 'none'; }

loginForm.addEventListener('submit', async e => {
  e.preventDefault();
  hideError();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password) { showError('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน'); return; }

  loginBtn.disabled = true;
  loginSpinner.style.display = 'block';
  loginBtnText.textContent = 'กำลังเข้าสู่ระบบ…';

  await new Promise(r => setTimeout(r, 600));

  const result = await Auth.login(username, password, true);
  if (result.ok) {
    loginBtnText.textContent = 'สำเร็จ ✓';
    loginBtn.classList.add('success');
    loginSpinner.style.display = 'none';
    setTimeout(() => window.location.replace('WQIS-PRO3S.html'), 380);
  } else {
    loginSpinner.style.display = 'none';
    loginBtnText.textContent = 'เข้าสู่ระบบ';
    loginBtn.disabled = false;
    showError('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง กรุณาลองใหม่');
    shakeCard();
    document.getElementById('password').value = '';
    document.getElementById('password').focus();
  }
});

document.getElementById('username').focus();

// Ripple on login button
loginBtn.style.cssText += ';position:relative;overflow:hidden';
loginBtn.addEventListener('click', e => {
  const r = document.createElement('span');
  r.className = 'ripple';
  r.style.background = 'rgba(255,255,255,0.3)';
  const rect = loginBtn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  r.style.cssText += `;width:${size}px;height:${size}px;left:${e.clientX-rect.left-size/2}px;top:${e.clientY-rect.top-size/2}px;position:absolute;border-radius:50%;transform:scale(0);animation:rippleOut 0.55s ease-out forwards;pointer-events:none`;
  loginBtn.appendChild(r);
  r.addEventListener('animationend', () => r.remove(), { once:true });
});

// Shake on error
function shakeCard() {
  const card = document.querySelector('.login-card');
  card.style.animation = 'none';
  card.getBoundingClientRect(); // reflow
  card.style.animation = 'shakeX 0.45s ease';
  card.addEventListener('animationend', () => { card.style.animation = ''; }, { once:true });
}
</script>
<style>
@keyframes shakeX {
  0%,100% { transform:translateX(0); }
  18%      { transform:translateX(-8px); }
  36%      { transform:translateX(7px); }
  54%      { transform:translateX(-5px); }
  72%      { transform:translateX(4px); }
  86%      { transform:translateX(-2px); }
}
@keyframes rippleOut {
  to { transform:scale(4); opacity:0; }
}
</style>
</body>
</html>
